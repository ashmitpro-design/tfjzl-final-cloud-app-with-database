<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }} | OnlineCourse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">OnlineCourse</a>
    </nav>

    <main class="container py-4">
        <header class="mb-4">
            <h1 class="display-4">{{ course.name }}</h1>
            <p class="lead">{{ course.description }}</p>
        </header>

        <section aria-labelledby="lessons-heading">
            <h2 id="lessons-heading" class="mb-3">Course lessons</h2>
            <div class="list-group">
                {% for lesson in course.lesson_set.all %}
                    <article class="list-group-item">
                        <h3 class="h5">{{ lesson.title }}</h3>
                        <p class="mb-1">Lesson {{ lesson.order|add:1 }}</p>
                        <div>{{ lesson.content }}</div>
                    </article>
                {% empty %}
                    <div class="alert alert-info">No lessons are available for this course yet.</div>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
